<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AGU_app | チームアプリ ポータル</title>
<meta name="apple-mobile-web-app-title" content="AGU_app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="AGU駅伝部で使っている各種チームアプリへの入り口となるポータルです。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">AGU</span>
        <span class="brand-sub">チームアプリ ポータル</span>
      </div>
      <input id="search" class="search" type="search" placeholder="アプリを検索…" autocomplete="off">
    </div>
    <div class="header-nav" id="headerNav"></div>
  </header>

  <main class="main" id="main">
    <!-- 役割メニュー / 全アプリ一覧は script.js が apps-data.js / roles-data.js から自動生成します -->
  </main>

  <footer class="footer">
    <p>
      新しいアプリを追加するときは <code>apps-data.js</code> を、役割ごとのメニューを変更するときは
      <code>roles-data.js</code> を編集してください。
      デプロイ済みURLが未確認のアプリは、確認でき次第 <code>liveUrl</code> を設定するとカードから直接開けるようになります。
    </p>
  </footer>

  <script src="apps-data.js"></script>
  <script src="roles-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
