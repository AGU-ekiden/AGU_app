name: Deploy spm-medical-record (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - "apps/spm-medical-record/**"
      - ".github/workflows/deploy-spm-medical-record.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spm-medical-record
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/spm-medical-record/package-lock.json

      - run: npm install

      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
